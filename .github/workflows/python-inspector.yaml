name: Python Inspector

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Print Python and pip versions
        run: |
          python --version
          pip --version

      - name: Print Python binary location
        run: which python

      - name: Print completion message
